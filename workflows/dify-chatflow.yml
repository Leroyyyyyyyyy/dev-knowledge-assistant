      width: 244
    - data:
        code: "\ndef main(text: str, run_id: str, handles: str) -> dict:\n    import\
          \ json\n    import re\n    raw = text\n    # Reasoning models may emit <think>...</think>\
          \ before the answer; the\n    # reasoning can itself contain braces, so\
          \ drop everything up to its end.\n    if \"</think>\" in raw:\n        raw\
          \ = raw.split(\"</think>\")[-1]\n    raw = raw.strip()\n    if raw.startswith(\"\
          ```\"):\n        raw = raw.strip(\"`\")\n        if raw.startswith(\"json\"\
          ):\n            raw = raw[4:]\n    start = raw.find(\"{\")\n    end = raw.rfind(\"\
          }\")\n    try:\n        parsed = json.loads(raw[start:end + 1])\n      \
          \  handle_map = json.loads(handles)\n        cited = []\n        number_of\
          \ = {}\n        for item in parsed.get(\"cited_chunk_ids\", []):\n     \
          \       handle = str(item).strip()\n            # Unknown handles are passed\
          \ through unchanged, so the backend rejects them.\n            cited.append(handle_map.get(handle,\
          \ item))\n            number_of[handle] = len(cited)\n\n        # The reader\
          \ sees a numbered citation list, so \"(C8)\" in the text becomes \"[3]\"\
          .\n        def renumber(match):\n            handle = match.group(1)\n \
          \           if handle in number_of:\n                return \"[%d]\" % number_of[handle]\n\
          \            return match.group(0)\n\n        answer_text = re.sub(r\"\\\
          [?\\b(C\\d+)\\b\\]?\", renumber, parsed[\"answer_text\"])\n        payload\
          \ = {\n            \"run_id\": run_id,\n            \"status\": parsed[\"\
          status\"],\n            \"answer_text\": answer_text,\n            \"cited_chunk_ids\"\
          : cited,\n            \"model\": \"langgenius/deepseek/deepseek:deepseek-v4-flash\"\
          ,\n            \"prompt_version\": \"gen-v1\",\n        }\n        return\
          \ {\"payload\": json.dumps(payload, ensure_ascii=False), \"parse_error\"\
          : \"\"}\n    except Exception as exc:\n        return {\"payload\": \"{}\"\
          , \"parse_error\": \"输出不是要求的 JSON 对象：%s\" % type(exc).__name__}\n"
        code_language: python3
        desc: ''
        outputs:
          parse_error:
            children: null
            type: string
          payload:
            children: null
            type: string
        title: 整理答案
        type: code
        variables:
        - value_selector:
