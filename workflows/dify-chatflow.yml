        desc: ''
        error_strategy: fail-branch
        model:
          completion_params:
            max_tokens: 2048
            temperature: 0.2
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: fix-system
          role: system
          text: '你是一个代码库问答助手。只能根据「片段」回答，片段来自两个仓库在固定 commit 上的代码和文档。


            规则：

            1. 每个结论都必须能在你引用的片段里找到依据。片段没有的内容不要补充，不要凭常识推测实现细节。

            2. 每个片段标题开头有一个编号，例如 [C1]。cited_chunk_ids 里只放这些编号（如 "C1"、"C3"），只能用片段里出现过的编号，不能编造。

            3. 正文不要写任何链接或 URL，链接由系统根据引用自动生成。提到文件时写路径即可。

            4. 片段不足以回答时，status 写 insufficient_evidence，answer_text 说明能确定的部分和缺少什么；能确定的部分仍要引用对应片段。

            5. 用中文回答，简洁，先给结论再给依据。

            6. 只输出一个 JSON 对象，不要输出任何其他文字或代码块标记：

            {"status": "answered" 或 "insufficient_evidence", "answer_text": "...",
            "cited_chunk_ids": ["C1", "C2"]}'
        - id: fix-user
          role: user
          text: '问题：{{#sys.query#}}


            片段：

            {{#parse_retrieve.context#}}


            你上一次的输出：

            {{#generate.text#}}


            这次输出没有通过校验，原因：

            {{#check_submit.error_text#}}


            请修正后重新输出 JSON。引用只能用片段标题开头的编号（如 "C1"），正文不要写链接。'
        reasoning_format: separated
        title: 修正答案（仅一次）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
