    - data:
        code: "\ndef main(query: str, pending_question: str, router_text: str) ->\
          \ dict:\n    import json\n\n    descriptions = {\n        \"fieldops\":\
          \ \"工单 API：工单状态机、审计事件、PostgreSQL\",\n        \"mineops\": \"采矿运维平台：遥测接入、MQTT、Operations\
          \ Copilot\",\n    }\n\n    def named_repos(text):\n        lowered = text.lower()\n\
          \        found = []\n        for repo_id in descriptions:\n            if\
          \ repo_id in lowered:\n                found.append(repo_id)\n        return\
          \ found\n\n    # The router is a reasoning model: drop anything up to </think>,\
          \ then read\n    # the first JSON object. An unreadable answer counts as\
          \ \"no decision\".\n    label = \"\"\n    text = router_text.split(\"</think>\"\
          )[-1]\n    start, end = text.find(\"{\"), text.rfind(\"}\")\n    if start\
          \ != -1 and end > start:\n        try:\n            label = json.loads(text[start:end\
          \ + 1]).get(\"repo\", \"\")\n        except Exception:\n            label\
          \ = \"\"\n\n    result = {\"action\": \"retrieve\", \"question\": query.strip(),\
          \ \"repo_id\": \"\",\n              \"scope_note\": \"\", \"clarify_text\"\
          : \"\"}\n\n    named = named_repos(query)\n    says_both = \"都\" in query\
          \ or \"两个\" in query\n    # A long reply that names no repository is a new\
          \ question, not an answer\n    # to \"which repository?\"; the pending one\
          \ is dropped.\n    answering = pending_question and (named or says_both\
          \ or len(query.strip()) <= 15)\n\n    if answering:\n        # Search with\
          \ the original question. Ask only once: if the reply\n        # still does\
          \ not settle it, search both and say so.\n        result[\"question\"] =\
          \ pending_question\n        if len(named) == 1:\n            result[\"repo_id\"\
          ] = named[0]\n        elif len(named) == 2 or says_both:\n            result[\"\
          repo_id\"] = \"\"\n        elif label in descriptions:\n            result[\"\
          repo_id\"] = label\n        else:\n            result[\"scope_note\"] =\
          \ \"没能从回复里确定是哪个仓库，两个仓库都查了。\"\n    else:\n        if len(named) == 1:\n \
          \           result[\"repo_id\"] = named[0]\n        elif len(named) == 2\
          \ or label == \"both\":\n            result[\"repo_id\"] = \"\"\n      \
          \  elif label in descriptions:\n            result[\"repo_id\"] = label\n\
          \        elif label == \"unclear\":\n            lines = [\"这个问题两个仓库可能都涉及，你问的是哪一个？\"\
          , \"\"]\n            for repo_id, description in descriptions.items():\n\
          \                lines.append(\"- **%s**：%s\" % (repo_id, description))\n\
          \            lines.append(\"\")\n            lines.append('<button data-message=\"\
          fieldops\" data-variant=\"primary\">fieldops</button>')\n            lines.append('<button\
          \ data-message=\"mineops\" data-variant=\"primary\">mineops</button>')\n\
          \            lines.append('<button data-message=\"两个都查\">两个都查</button>')\n\
          \            result[\"action\"] = \"ask\"\n            result[\"clarify_text\"\
          ] = \"\\n\".join(lines)\n            return result\n        else:\n    \
          \        result[\"scope_note\"] = \"仓库判断这一步没有返回结果，两个仓库都查了。\"\n\n    if result[\"\
          repo_id\"]:\n        scope = \"检索范围：\" + result[\"repo_id\"]\n    else:\n\
          \        scope = \"检索范围：fieldops、mineops\"\n    if result[\"scope_note\"\
          ]:\n        scope = scope + \"（\" + result[\"scope_note\"] + \"）\"\n   \
          \ result[\"scope_note\"] = scope\n    return result\n"
