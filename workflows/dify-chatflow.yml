    - data:
        code: "\ndef main(query: str) -> dict:\n    import json\n    import re\n\n\
          \    # Feedback buttons under each answer send \"反馈：<label> run=<run_id>\"\
          .\n    # The run id travels in the message itself, so a click on an older\n\
          \    # answer's button records feedback for that answer, not the latest\
          \ one.\n    labels = {\n        \"解决了\": (True, None),\n        \"答案不对\"\
          : (False, \"wrong_answer\"),\n        \"不完整\": (False, \"incomplete\"),\n\
          \        \"引用不对\": (False, \"wrong_citation\"),\n        \"不相关\": (False,\
          \ \"not_relevant\"),\n    }\n    result = {\"kind\": \"question\", \"payload\"\
          : \"\", \"label\": \"\"}\n    match = re.fullmatch(r\"反馈：(\\S+)\\s+run=([0-9a-f-]{36})\"\
          , query.strip())\n    if match is None or match.group(1) not in labels:\n\
          \        return result\n\n    label = match.group(1)\n    resolved, reason\
          \ = labels[label]\n    body = {\"run_id\": match.group(2), \"resolved\"\
          : resolved}\n    if reason is not None:\n        body[\"reason\"] = reason\n\
          \    result[\"kind\"] = \"feedback\"\n    result[\"payload\"] = json.dumps(body)\n\
          \    result[\"label\"] = label\n    return result\n"
