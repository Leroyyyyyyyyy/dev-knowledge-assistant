      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "\ndef main(parse_error: str, status_code: int, body: str) -> dict:\n\
          \    import json\n    result = {\"route\": \"error\", \"final_text\": \"\
          \", \"error_text\": \"\"}\n    if parse_error:\n        result[\"route\"\
          ] = \"fix\"\n        result[\"error_text\"] = parse_error\n        return\
          \ result\n    try:\n        data = json.loads(body)\n    except Exception:\n\
          \        result[\"error_text\"] = \"答案服务返回了无法解析的内容（HTTP %s）\" % status_code\n\
          \        return result\n\n    if status_code == 422:\n        result[\"\
          route\"] = \"fix\"\n        result[\"error_text\"] = \"%s：%s\" % (data.get(\"\
          code\", \"?\"), data.get(\"message\", \"\"))\n        return result\n  \
          \  if status_code != 200:\n        result[\"error_text\"] = \"答案服务返回错误 %s：%s（request_id\
          \ %s）\" % (\n            status_code, data.get(\"code\", \"?\"), data.get(\"\
          request_id\", \"?\"))\n        return result\n\n    lines = []\n    if data[\"\
          status\"] == \"insufficient_evidence\":\n        lines.append(\"**证据不足**，以下只是资料中能确定的部分。\"\
          )\n        lines.append(\"\")\n    lines.append(data[\"answer_text\"])\n\
          \    if data[\"citations\"]:\n        lines.append(\"\")\n        lines.append(\"\
          **引用**\")\n        for number, citation in enumerate(data[\"citations\"\
          ], start=1):\n            label = \"%s:%s#L%s-L%s\" % (\n              \
          \  citation[\"repo_id\"], citation[\"path\"], citation[\"start_line\"],\
          \ citation[\"end_line\"])\n            lines.append(\"%s. [%s](%s)\" % (number,\
          \ label, citation[\"url\"]))\n    lines.append(\"\")\n    lines.append(\"\
          `run_id: %s`\" % data[\"run_id\"])\n    result[\"route\"] = \"ok\"\n   \
          \ result[\"final_text\"] = \"\\n\".join(lines)\n    return result\n"
        code_language: python3
        desc: ''
        outputs:
