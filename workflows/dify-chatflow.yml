            - fieldops：fieldops-workorder-bridge，矿山维修承包商的工单 API。工单状态机（NEW → ASSIGNED
            → IN_PROGRESS → COMPLETED，可取消，不能重开）、命名命令而不是通用 PATCH、每次变更在同一事务里写审计事件、资产、FastAPI、SQLAlchemy、PostgreSQL、Alembic
            迁移。

            - mineops：采矿运维平台。车队模拟器、MQTT、遥测事件接入（event_id 幂等、乱序事件）、设备最新状态、Operations
            Copilot（只读工具、结构化结论、需要审批的处置动作）、FastAPI、PostgreSQL、Makefile。


            输出规则：

            - 问题里的概念只属于一个仓库 → 输出那个仓库。

            - 问题明确要求比较两个仓库，或者问两个仓库共同的东西 → both。

            - 问题是两个仓库都可能有、但答案会不同的通用事情（怎么运行、怎么测试、怎么部署、依赖、配置、数据库迁移、项目结构等），又没有说是哪个仓库
            → unclear。

            - 如果给了「上一轮待澄清的问题」，本轮输入通常是用户对「哪个仓库」的回复，只根据这条回复判断，看不出仓库就输出 unclear；如果本轮输入明显是一个新问题，就按新问题判断。


            只输出一个 JSON 对象，不要输出其他文字：{"repo": "fieldops" 或 "mineops" 或 "both" 或 "unclear"}'
        - id: route-user
          role: user
          text: '上一轮待澄清的问题（为空表示没有）：{{#conversation.pending_question#}}


            本轮输入：{{#sys.query#}}'
