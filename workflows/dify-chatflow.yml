    - data:
        code: "\ndef main(status_code: int, body: str) -> dict:\n    import json\n\
          \    result = {\"route\": \"error\", \"run_id\": \"\", \"context\": \"\"\
          , \"handles\": \"{}\", \"error_text\": \"\"}\n    try:\n        data = json.loads(body)\n\
          \    except Exception:\n        # Not our JSON: the response came from Dify's\
          \ outbound proxy, which\n        # answers for the service when it cannot\
          \ connect to it.\n        if \"ERR_CONNECT_FAIL\" in body or \"ERR_READ_TIMEOUT\"\
          \ in body:\n            result[\"error_text\"] = \"连不上检索服务（没有在运行，或地址不对），这次没有生成回答。\"\
          \n        else:\n            result[\"error_text\"] = \"检索服务返回了无法解析的内容（HTTP\
          \ %s），这次没有生成回答。\" % status_code\n        return result\n\n    if status_code\
          \ != 200:\n        hint = \"\"\n        if status_code == 401:\n       \
          \     hint = \"Dify 里的 DKA_SERVICE_TOKEN 可能和服务端不一致。\"\n        elif data.get(\"\
          code\") == \"NO_ACTIVE_INDEX\":\n            hint = \"服务还没有可用的索引。\"\n  \
          \      result[\"error_text\"] = \"检索服务返回错误 %s：%s（request_id %s）。%s\" % (\n\
          \            status_code, data.get(\"code\", \"?\"), data.get(\"request_id\"\
          , \"?\"), hint)\n        return result\n\n    result[\"run_id\"] = data[\"\
          run_id\"]\n    if data[\"status\"] != \"ok\" or not data[\"chunks\"]:\n\
          \        result[\"route\"] = \"no_evidence\"\n        return result\n\n\
          \    # The model cites short handles (C1, C2...) instead of copying long\
          \ chunk ids;\n    # build_answer maps them back. The backend still validates\
          \ the real ids.\n    blocks = []\n    handles = {}\n    for number, chunk\
          \ in enumerate(data[\"chunks\"], start=1):\n        handle = \"C%d\" % number\n\
          \        handles[handle] = chunk[\"chunk_id\"]\n        header = \"[%s]\
          \ %s:%s 第 %s-%s 行\" % (\n            handle, chunk[\"repo_id\"], chunk[\"\
          path\"], chunk[\"start_line\"], chunk[\"end_line\"])\n        blocks.append(header\
          \ + \"\\n\" + chunk[\"content\"][:4000])\n    result[\"context\"] = \"\\\
          n\\n---\\n\\n\".join(blocks)\n    result[\"handles\"] = json.dumps(handles)\n\
          \    result[\"route\"] = \"ok\"\n    return result\n"
        code_language: python3
        desc: ''
